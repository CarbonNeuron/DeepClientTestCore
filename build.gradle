plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    ivy {
        name = 'BaritoneGitHubReleases'
        url = 'https://github.com/cabaletta/baritone/releases/download'
        patternLayout {
            artifact 'v[revision]/[artifact]-[revision].[ext]'
        }
        metadataSources { artifact() }
        content { includeModule 'baritone', 'baritone-api-fabric' }
    }
}

def baritoneDistribution = configurations.create('baritoneDistribution')
dependencies.add('baritoneDistribution', "baritone:baritone-api-fabric:${project.baritone_version}") {
    transitive = false
}

// Loom removes the nested-jars declaration while remapping the Baritone release.
// Extract its required pathfinder jar into the ignored Gradle cache and load it explicitly.
def pathfinderJar = file(".gradle/deepclient-dependencies/nether-pathfinder-1.4.1.jar")
if (!pathfinderJar.exists()) {
    copy {
        from zipTree(baritoneDistribution.singleFile)
        include 'META-INF/jars/nether-pathfinder-1.4.1.jar'
        eachFile { details -> details.path = details.name }
        includeEmptyDirs = false
        into pathfinderJar.parentFile
    }
}
if (!pathfinderJar.exists()) {
    throw new GradleException('The Baritone distribution did not contain nether-pathfinder-1.4.1.jar')
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation("baritone:baritone-api-fabric:${project.baritone_version}") {
        transitive = false
    }
    modImplementation files(pathfinderJar)
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property 'version', project.version
    from('openapi.yaml')
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
