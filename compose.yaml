name: deepclient
services:
  client-image:
    build: .
    image: deep-client-test-core:1.21.1
    entrypoint: ["/bin/true"]
    restart: "no"

  manager:
    build: ./manager
    depends_on:
      client-image:
        condition: service_completed_successfully
    environment:
      DEEPCLIENT_MANAGER_TOKEN: ${DEEPCLIENT_TOKEN:?Set DEEPCLIENT_TOKEN in .env}
      DEEPCLIENT_SESSION_IMAGES: 1.21.1=deep-client-test-core:1.21.1
      DEEPCLIENT_SESSION_NETWORK: deepclient-sessions
      DEEPCLIENT_SESSION_IDLE_TTL: ${DEEPCLIENT_SESSION_IDLE_TTL:-30m}
      DEEPCLIENT_GPU_MODE: ${DEEPCLIENT_GPU_MODE:-none}
      DEEPCLIENT_HSA_OVERRIDE_GFX_VERSION: ${DEEPCLIENT_HSA_OVERRIDE_GFX_VERSION:-}
      DEEPCLIENT_MESA_D3D12_ADAPTER_NAME: ${DEEPCLIENT_MESA_D3D12_ADAPTER_NAME:-AMD}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - sessions
    restart: unless-stopped

networks:
  sessions:
    name: deepclient-sessions
